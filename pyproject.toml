[project]
name = "mini-llm"
version = "0.1.0"
description = "Small decoder-only LM trained from scratch on FineWeb-Edu (course assignments)"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.7",            # 2.7+ has CUDA 12.8 builds for Blackwell (RTX 5060, sm_120)
    "numpy>=1.26",
    "datasets>=2.19",
    "huggingface_hub>=0.23",
    "tokenizers>=0.19",
    "tqdm>=4.66",
    "matplotlib>=3.11.2",
]

[tool.uv]
package = false              # plain scripts, not an installable package

# Pull torch from PyTorch's CUDA 12.8 index instead of PyPI (PyPI's Windows wheel is CPU-only).
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true              # only torch comes from here; everything else from PyPI

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "sys_platform == 'win32' or sys_platform == 'linux'" }]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
]
